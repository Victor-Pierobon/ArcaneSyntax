name: CI

on:
  push:
  pull_request:

jobs:
  executor:
    name: pytest (executor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
        working-directory: executor

  game:
    name: GdUnit4 (game)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Baixar Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT_BIN=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Importar assets
        working-directory: game
        run: timeout 300 "$GODOT_BIN" --headless --path . --import || true
      - name: Rodar testes
        working-directory: game
        run: bash addons/gdUnit4/runtest.sh --headless -a res://tests --ignoreHeadlessMode
      - name: Relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-reports
          path: game/reports/
          if-no-files-found: ignore
